on:
  push:
    branches:
      - 'main'
jobs:
  flake8:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          pip install flake8
      - name: Run flake8
        run: |
          flake8 backend/app/routers --max-line-length=120
      - name: Run flake8 for errors
        run: |
          flake8 --count --select=E9,F63,F7,F82 --show-source --statistics backend/app/routers
      - name: Run flake8 for warnings
        run: |
          flake8 --count --max-complexity=10 --max-line-length=120 --statistics backend/app/routers
  building:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_GCP }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ vars.REGISTRY_GCP }}/cloudeforge/cloudforge/cloudforge-backend:${{ github.sha }}
  helmupgrading:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_HELM }}


      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west3-b
          project_id: ${{ vars.GCP_PROJECT_ID }}


      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Upgrade Helm release
        run: |
          helm upgrade cloudforge helm/cloudforge \
            --install \
            --namespace platform \
            --create-namespace \
            --set image.repository=${{ vars.REGISTRY_GCP }}/cloudeforge/cloudforge/cloudforge-backend \
            --set image.tag=${{ github.sha }} \
            --set gcpServiceAccount=${{ vars.GCP_SERVICE_ACCOUNT_HELM }} \
            --set projectId=${{ vars.GCP_PROJECT_ID }} \
            --set cloudSql.instanceConnectionName=${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }} \
            --set cloudSql.port=${{ vars.CLOUD_SQL_PORT }}