apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudforge-deployer
  namespace: dev

rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudforge-deployer
  namespace: dev

subjects:
  - kind: ServiceAccount
    name: cloudforge-backend
    namespace: platform

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudforge-deployer