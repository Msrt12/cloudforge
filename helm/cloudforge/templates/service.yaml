apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}
  namespace: platform
  annotations:
    cloud.google.com/backend-config: '{"default": "cloudforge-backendconfig"}'

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ .Release.Name }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP