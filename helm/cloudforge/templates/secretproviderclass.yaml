apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: cloudforge-secrets
  namespace: platform

spec:
  provider: gke

  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.projectId }}/secrets/cloudforge-dev-db-name/versions/latest"
        path: "db-name"

      - resourceName: "projects/{{ .Values.projectId }}/secrets/cloudforge-dev-db-user/versions/latest"
        path: "db-user"

      - resourceName: "projects/{{ .Values.projectId }}/secrets/cloudforge-dev-db-password/versions/latest"
        path: "db-password"