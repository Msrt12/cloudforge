
controller:
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.580.2-jdk21"

  additionalPlugins:
    - job-dsl

  JCasC:
    defaultConfig: true
    configScripts:
      cloudforge-jobs: |
        jobs:
          - script: |
              pipelineJob('cloudforge-build') {
                description('CI pipeline for CloudForge applications')

                parameters {
                    stringParam('APPLICATION_ID', '', 'Application ID')
                    stringParam('REPOSITORY_URL', '', 'Git repository URL')
                    stringParam('CLOUDFORGE_BUILD_ID', '', 'CloudForge Build ID')
                }

                definition {
                  cps {
                    script('''
                      pipeline {
                        agent {
                          kubernetes {
                            cloud 'kubernetes'
                            inheritFrom 'default'
                            yaml """
                              apiVersion: v1
                              kind: Pod
                              spec:
                                serviceAccountName: jenkins-agent
                                containers:
                                  - name: buildkit
                                    image: moby/buildkit:rootless
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    env:
                                      - name: BUILDKITD_FLAGS
                                        value: "--oci-worker-no-process-sandbox"
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                      seccompProfile:
                                        type: Unconfined
                                      appArmorProfile:
                                        type: Unconfined
                                  - name: trivy
                                    image: aquasec/trivy:0.69.3
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                    env:
                                      - name: TRIVY_CACHE_DIR
                                        value: /tmp/trivy-cache  
                                  - name: skopeo
                                    image: quay.io/skopeo/stable:latest
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                  - name: gcloud
                                    image: google/cloud-sdk:slim
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                    env:
                                      - name: CLOUDSDK_CONFIG
                                        value: /tmp/gcloud-config  
                            """.stripIndent()
                          }
                        }

                        options {
                          skipDefaultCheckout()
                        }
                        environment {
                        REGISTRY = 'europe-west3-docker.pkg.dev'
                        PROJECT_ID = 'cloudeforge'
                        REGISTRY_REPOSITORY = 'cloudforge/cloudforge-backend'                        
                        CLOUDFORGE_URL = 'http://cloudforge-backend.platform.svc.cluster.local:80'
                        }
                        stages {
                          stage('Checkout') {
                            steps {
                              git branch: 'main', url: params.REPOSITORY_URL
                            }
                          }

                          stage('Validate Dockerfile') {
                            steps {
                              script {
                                if (!fileExists('Dockerfile')) {
                                  error('Dockerfile not found in repository root!')
                                }
                              }
                            }
                          }

                          stage('Build Image') {
                            steps {
                              container('buildkit') {
                                sh "buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output type=docker,dest=./cloudforge-image.tar"
                              }
                            }
                          }
                          stage('Security Scan') {
                            steps {
                                container('trivy') {
                                    sh "trivy image --input cloudforge-image.tar --severity HIGH,CRITICAL --exit-code 1"
                                }
                            }
                        }
                        stage('Push to Artifact Registry') {
                          steps {
                              container('gcloud') {
                                  sh 'set +x; umask 077; gcloud auth print-access-token > .gcp-token'
                              }

                              container('skopeo') {
                                  sh 'set +x; skopeo login --authfile .registry-auth.json --username oauth2accesstoken --password-stdin $REGISTRY < .gcp-token'

                                  sh 'skopeo copy --authfile .registry-auth.json docker-archive:cloudforge-image.tar docker://$REGISTRY/$PROJECT_ID/$REGISTRY_REPOSITORY/app-$APPLICATION_ID:$BUILD_NUMBER'
                              }
                              script {
                                  env.IMAGE_URI = "$REGISTRY/$PROJECT_ID/$REGISTRY_REPOSITORY/app-$APPLICATION_ID:$BUILD_NUMBER"
                              }
                          }
                          post {
                              always {
                                  sh 'rm -f .gcp-token .registry-auth.json'
                              }
                          }
                          post {
                            always {
                                script {
                                    withCredentials([
                                        string(
                                            credentialsId: 'cloudforge-callback-token',
                                            variable: 'CALLBACK_TOKEN'
                                        )
                                    ]) {
                                        container('gcloud') {
                                            def payload = groovy.json.JsonOutput.toJson([
                                                jenkins_build_number: env.BUILD_NUMBER.toInteger(),
                                                status: currentBuild.currentResult,
                                                image_uri: currentBuild.currentResult == 'SUCCESS'
                                                    ? env.IMAGE_URI : null
                                            ])

                                            writeFile file: 'callback.json', text: payload

                                            sh 'set +x; curl --fail --silent --show-error --max-time 15 -X POST "$CLOUDFORGE_URL/applications/builds/$CLOUDFORGE_BUILD_ID/callback" -H "Content-Type: application/json" -H "X-Callback-Token: $CALLBACK_TOKEN" --data-binary @callback.json'
                                        }
                                    }
                                }
                            }
                        }
                      }
                        }
                      }
                    '''.stripIndent())
                    sandbox()
                  }
                }
              }

  numExecutors: 0

  serviceType: ClusterIP

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

persistence:
  enabled: true
  size: "8Gi"

rbac:
  create: true

serviceAccountAgent:
  create: true
  name: jenkins-agent
  annotations:
    iam.gke.io/gcp-service-account: cloudforge-jenkins-agent@cloudeforge.iam.gserviceaccount.com


serviceAccount:
  create: true
