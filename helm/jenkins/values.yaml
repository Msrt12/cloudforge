
controller:
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.580.2-jdk21"

  additionalPlugins:
    - job-dsl

  JCasC:
    defaultConfig: true
    configScripts:
      cloudforge-jobs: |
        jobs:
          - script: |
              pipelineJob('cloudforge-build') {
                description('CI pipeline for CloudForge applications')

                parameters {
                  stringParam('APPLICATION_ID', '', 'CloudForge application ID')
                  stringParam('REPOSITORY_URL', '', 'Git repository URL')
                }

                definition {
                  cps {
                    script('''
                      pipeline {
                        agent {
                          kubernetes {
                            cloud 'kubernetes'
                            inheritFrom 'default'
                            yaml """
                              apiVersion: v1
                              kind: Pod
                              spec:
                                serviceAccountName: jenkins-agent
                                containers:
                                  - name: buildkit
                                    image: moby/buildkit:rootless
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    env:
                                      - name: BUILDKITD_FLAGS
                                        value: "--oci-worker-no-process-sandbox"
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                      seccompProfile:
                                        type: Unconfined
                                      appArmorProfile:
                                        type: Unconfined
                                  - name: trivy
                                    image: aquasec/trivy:0.69.3
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000
                                    env:
                                      - name: TRIVY_CACHE_DIR
                                        value: /tmp/trivy-cache  
                                  - name: skopeo
                                    image: quay.io/skopeo/stable:latest
                                    command:
                                      - sleep
                                    args:
                                      - "99d"
                                    tty: true
                                    securityContext:
                                      runAsUser: 1000
                                      runAsGroup: 1000    
                            """.stripIndent()
                          }
                        }

                        options {
                          skipDefaultCheckout()
                        }

                        stages {
                          stage('Checkout') {
                            steps {
                              git branch: 'main', url: params.REPOSITORY_URL
                            }
                          }

                          stage('Validate Dockerfile') {
                            steps {
                              script {
                                if (!fileExists('Dockerfile')) {
                                  error('Dockerfile not found in repository root!')
                                }
                              }
                            }
                          }

                          stage('Build Image') {
                            steps {
                              container('buildkit') {
                                sh "buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output type=docker,dest=./cloudforge-image.tar"
                              }
                            }
                          }
                          stage('Security Scan') {
                            steps {
                                container('trivy') {
                                    sh "trivy image --input cloudforge-image.tar --severity HIGH,CRITICAL --exit-code 1"
                                }
                            }
                        }
                        }
                      }
                    '''.stripIndent())
                    sandbox()
                  }
                }
              }

  numExecutors: 0

  serviceType: ClusterIP

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

persistence:
  enabled: true
  size: "8Gi"

rbac:
  create: true

serviceAccountAgent:
  create: true
  name: jenkins-agent
  annotations:
    iam.gke.io/gcp-service-account: cloudforge-jenkins-agent@cloudeforge.iam.gserviceaccount.com


serviceAccount:
  create: true
