controller:
  image: "jenkins/jenkins"
  tag: "2.479.1-lts-jdk17"

  serviceType: ClusterIP

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

persistence:
  enabled: true
  size: "8Gi"

rbac:
  create: true

serviceAccount:
  create: true