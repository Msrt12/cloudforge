controller:
  startupProbe:
    httpGet:
      path: /login
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 60
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.580.2-jdk21"
  additionalPlugins:
    - job-dsl
  JCasC:
    defaultConfig: true
    configScripts:
      cloudforge-jobs: |
        jobs:
          - script: |
              pipelineJob('cloudforge-build') {
                description('CI pipeline for CloudForge applications')

                parameters {
                  stringParam('APPLICATION_ID', '', 'CloudForge application ID')
                  stringParam('REPOSITORY_URL', '', 'Git repository URL')
                }

                definition {
                  cps {
                    script('''
                      pipeline {
                        agent {
                            kubernetes {
                                cloud 'kubernetes'
                                inheritFrom 'default'
                                yaml '''
                        apiVersion: v1
                        kind: Pod
                        spec:
                          containers:
                            - name: buildkit
                              image: moby/buildkit:rootless
                              command:
                                - sleep
                              args:
                                - "99d"
                              tty: true
                              env:
                                - name: BUILDKITD_FLAGS
                                  value: "--oci-worker-no-process-sandbox"
                              securityContext:
                                runAsUser: 1000
                                runAsGroup: 1000
                                seccompProfile:
                                  type: Unconfined
                                appArmorProfile:
                                  type: Unconfined
                        '''
                            }
                        }
                        stages {
                          stage('Checkout') {
                            steps {
                                git branch: 'main', url: params.REPOSITORY_URL
                            }
                          }
                        }
                          stage('Validate Dockerfile') {
                            steps {
                                script {
                                    if (!fileExists('Dockerfile')) {
                                        error('Dockerfile not found in repository root!')
                                    }
                                }
                            }
                          stage('Build Image') {
                            steps {
                                container('buildkit') {
                                    sh '''
                                        buildctl-daemonless.sh build \
                                          --frontend dockerfile.v0 \
                                          --local context=. \
                                          --local dockerfile=. \
                                          --output type=oci,dest=/tmp/cloudforge-image.tar
                                      '''
                                }
                            }
                          }
                        }
                      }
                    '''.stripIndent())
                    sandbox()
                  }
                }
              }
  numExecutors: 0
  serviceType: ClusterIP

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

persistence:
  enabled: true
  size: "8Gi"

rbac:
  create: true

serviceAccount:
  create: true