apiVersion: v1
kind: Pod
metadata:
  name: buildkit-test
  namespace: jenkins
spec:
  restartPolicy: Never
  containers:
    - name: buildkit
      image: moby/buildkit:rootless
      command: ["sh", "-c"]
      args:
        - |
          buildctl-daemonless.sh debug workers
      env:
        - name: BUILDKITD_FLAGS
          value: "--oci-worker-no-process-sandbox"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined